<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#08090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Onderwereld">
<title>Onderwereld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="/js/notap.js"></script>
<div class="boot" id="boot"><span>ONDERWERELD</span></div>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main>
    <div class="ticker" id="ticker"></div>
    <div class="topbar" id="topbar"></div>
    <section id="view"></section>
  </main>
  <aside class="rail" id="rail" aria-label="Overzicht"></aside>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="modalbox" role="alertdialog" aria-labelledby="modalT"><div class="siren"></div><h2 id="modalT"></h2><p id="modalM"></p><div id="modalB"></div></div></div>

<script>
// Opstart: controleer de inlog, haal de voortgang uit de database en laad daarna het spel.
// Zonder server (bijvoorbeeld bestand lokaal geopend) speel je offline met opslag in de browser.
(async function(){
  let token=null;try{token=localStorage.getItem('ow_token')}catch(e){}
  const serverMode=location.protocol.startsWith('http');
  if(serverMode&&!token){location.replace('/?login=1');return}
  if(token){
    try{
      const h={Authorization:'Bearer '+token};
      const me=await fetch('/api/me',{headers:h});
      if(me.status===401){try{localStorage.removeItem('ow_token')}catch(e){}location.replace('/?login=1');return}
      if(me.ok){
        window.__TOKEN__=token;const mj=await me.json();window.__USER__=mj.username;window.__SINCE__=mj.since||null;window.__REDEEMED__=mj.redeemed||[];
        const st=await fetch('/api/state',{headers:h});
        if(st.ok){const j=await st.json();if(j&&j.state)window.__SERVER_STATE__=j.state}
      }
    }catch(e){/* server onbereikbaar: offline verder */}
  }
  const files=['js/slot.js','js/vis.js','js/data.js','js/state.js','js/ui.js','js/flee.js','js/carheist.js',
    'js/pages/dashboard.js','js/pages/misdaden.js','js/pages/casino.js','js/pages/skills.js',
    'js/pages/wapens.js','js/pages/bank.js','js/pages/bajes.js','js/pages/families.js','js/pages/ranglijst.js','js/pages/profiel.js',
    'js/actions.js','js/sfx.js','js/icons.js','js/pages/kluiskraker.js','js/pages/visdief.js','js/pages/tafels.js','js/pages/roulette.js','js/pages/munt.js','js/pages/mines.js','js/pages/vlucht.js','js/pages/bezit.js','js/pages/verblijf.js','js/pages/autos.js','js/main.js'];
  for(const f of files){await new Promise(res=>{const s=document.createElement('script');s.src=f;s.onload=res;s.onerror=res;document.body.appendChild(s)})}
  // Eerste keer inloggen met bestaande browser-voortgang: meteen naar de database sturen.
  if(window.__TOKEN__&&!window.__SERVER_STATE__&&typeof pushState==='function')pushState();
  document.getElementById('boot').remove();
})();
</script>
</body>
</html>
