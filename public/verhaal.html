<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>{{TITLE}}</title>
<meta name="robots" content="noindex">
<script>try{window.BRAND=JSON.parse('{{BRAND_JSON}}')}catch(e){}</script>
<style>html,body{margin:0;background:#08090b;color:#e8e4da;font-family:system-ui,sans-serif}.boot{position:fixed;inset:0;display:grid;place-items:center;background:#08090b;z-index:80;font-weight:800;font-size:28px;letter-spacing:.1em;color:#f2c230}
.sd-gate{max-width:420px;padding:24px;text-align:center;letter-spacing:0;font-size:16px;color:#e8e4da;display:flex;flex-direction:column;gap:10px;align-items:center}.sd-gate>span{color:#f2c230;letter-spacing:.2em;font-size:13px}.sd-gate b{font-size:24px}.sd-gate p{opacity:.8;line-height:1.5;margin:0}
.sd-gate-b{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}.sd-gate-b a{padding:12px 16px;background:#f2c230;color:#111;text-decoration:none;font-weight:700}.sd-gate-b a+a{background:transparent;color:#e8e4da;border:2px solid #3a3d44}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Big+Shoulders+Text:wght@600;700;800&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
</head>
<!-- Verhaal "De Bezorger": eigen pagina met een eigen, grotere stad (verhaal-map.js) op dezelfde engine als de Pixelstad.
     Je speelt Luca, los van je klikspel-karakter. Seizoen 1 is gratis; de Stad-modules (heler, klussen, vastgoed, casino …) worden hier niet geladen. -->
<body class="stad verhaal">
<script src="/js/notap.js"></script>
<div class="boot" id="boot"><span>DE BEZORGER</span></div>
<div id="stadWorld"></div>
<div class="app">
  <nav class="side" id="nav"></nav>
  <main>
    <div class="topbar" id="topbar"></div>
    <section id="view"></section>
  </main>
  <aside class="rail" id="rail" aria-label="Overzicht"></aside>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="modalbox" role="alertdialog" aria-labelledby="modalT"><div class="siren"></div><h2 id="modalT"></h2><p id="modalM"></p><div id="modalB"></div></div></div>

<script>
(async function(){
  window.__VERHAAL__=true;
  const boot=document.getElementById('boot');
  const fail=(t,html)=>{boot.innerHTML='<div class="sd-gate"><span>DE BEZORGER</span><b></b><p></p>'+(html||'')+'</div>';boot.querySelector('b').textContent=t[0];boot.querySelector('p').textContent=t[1]};
  let token=null;try{token=localStorage.getItem('ow_token')}catch(e){}
  if(!token){location.replace('/?login=1');return}
  const h={Authorization:'Bearer '+token};
  try{
    const me=await fetch('/api/me',{headers:h});
    if(me.status===401){try{localStorage.removeItem('ow_token')}catch(e){}location.replace('/?login=1&verlopen=1');return}
    if(me.status===403){location.replace('/game');return}
    if(!me.ok)throw new Error('me');
    const mj=await me.json();
    window.__TOKEN__=token;window.__USER__=mj.username;window.__SINCE__=mj.since||null;window.__REDEEMED__=mj.redeemed||[];
    window.__TIER__=mj.tier!=null?+mj.tier:null;window.__ADMIN__=!!mj.admin;window.__PUB__=!!mj.pub;
    // Seizoen 1 is voor iedereen: hier geen ledencheck (hoofdstuk 2+ controleert het verhaal zelf met tier())
    const sid=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');window.__SID__=sid;
    const st=await fetch('/api/state?sid='+sid,{headers:h});
    if(st.ok){const j=await st.json();window.__SERVER_REV__=j.rev||0;if(j&&j.state)window.__SERVER_STATE__=j.state}
  }catch(e){fail(['Geen verbinding','Het verhaal kan alleen online. Probeer het zo opnieuw.'],'<div class="sd-gate-b"><a class="btn" href="/verhaal">Opnieuw</a><a class="btn ghost" href="/game">Naar het klikspel</a></div>');return}
  try{const vr=await fetch('/api/version',{cache:'no-store'});if(vr.ok)window.__VER__=(await vr.json()).v||''}catch(e){}
  const V=window.__VER__?'?v='+window.__VER__:'';
  // dezelfde stijlen en scripts als het klikspel (voor je account, opslaan en de gedeelde stukken)
  let files=null,css=[];
  try{const g=await (await fetch('/game',{cache:'no-store'})).text();const m=g.match(/const files=(\[[\s\S]*?\]);/);if(m)files=JSON.parse(m[1].replace(/'/g,'"'));
    css=[...g.matchAll(/<link rel="stylesheet" href="(css\/[^"]+)">/g)].map(x=>x[1])}catch(e){}
  if(!files||!files.length){fail(['Laden mislukt','Ververs de pagina om het opnieuw te proberen.']);return}
  css.push('css/stad.css','css/stad-auto.css','css/stad-kaart.css','css/stad-fiets.css','css/verhaal.css');
  await Promise.all(css.map(f=>new Promise(res=>{const l=document.createElement('link');l.rel='stylesheet';l.href='/'+f+V;l.onload=l.onerror=res;document.head.appendChild(l)})));
  const load=f=>new Promise(res=>{const s=document.createElement('script');s.src='/'+f+V;s.onload=()=>res(true);s.onerror=()=>{s.remove();res(false)};document.body.appendChild(s)});
  for(const f of files){await load(f)}
  if(window.__TOKEN__&&!window.__SERVER_STATE__&&typeof pushState==='function')pushState();
  try{window.THREE=await import('/stad/vendor/three.module.min.js')}catch(e){fail(['Je browser kan dit niet tekenen','Het verhaal heeft WebGL nodig. Speel verder in het klikspel.'],'<div class="sd-gate-b"><a class="btn" href="/game">Naar het klikspel</a></div>');return}
  // de verhaalstad (verhaal-map.js, zelfde interface als stad-map.js); bestaat die (nog) niet, dan tijdelijk de Pixelstad-kaart
  if(!(await load('js/stad/verhaal-map.js'))||!window.STAD_MAP)await load('js/stad/stad-map.js');
  // de engine (zonder de Stad-modules: geen heler, klussen, vastgoed, casino, geheimen, gebeurtenissen met klikspelgeld)
  const ENGINE=['js/stad/stad-gfx.js','js/stad/stad-game.js','js/stad/stad-cam.js','js/stad/stad-sfx.js','js/stad/stad-kit.js','js/stad/stad-face.js','js/stad/stad-vak.js','js/stad/stad-mini.js','js/stad/stad-kraak.js',
    'js/stad/stad-avatar.js','js/stad/stad-emote.js','js/stad/stad-cars.js','js/stad/stad-ui.js','js/stad/stad-kaart.js','js/stad/stad-npc.js','js/stad/stad-police.js','js/stad/stad-phone.js','js/stad/stad-doen.js','js/stad/stad-sfeer.js'];
  // het verhaal: kern (G.story, G.cut, G.binnen, G.draag), dan wat de andere onderdelen bouwen (ontbrekende bestanden worden overgeslagen)
  const VERHAAL=['js/stad/stad-story.js','js/stad/stad-cut.js','js/stad/stad-binnen.js','js/stad/stad-draag.js','js/stad/stad-interieur.js',
    'js/stad/stad-leeftijd.js','js/stad/verhaal-kaart.js','js/stad/verhaal-instellingen.js','js/stad/verhaal-tram.js','js/stad/stad-fiets.js','js/stad/stad-bezorg.js','js/stad/verhaal-sfeer.js','js/stad/stad-h1.js'];
  for(const f of ENGINE)await load(f);
  for(const f of VERHAAL)await load(f);
  try{STAD.init(document.getElementById('stadWorld'))}catch(e){console.error(e);fail(['Je browser kan dit niet tekenen','Het verhaal heeft WebGL nodig. Speel verder in het klikspel.'],'<div class="sd-gate-b"><a class="btn" href="/game">Naar het klikspel</a></div>');return}
  boot.remove();
})();
</script>
</body>
</html>
